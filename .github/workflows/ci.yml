name: CI
# CI runs on pull_request only. The post-merge `push: branches: [main]` trigger
# was removed: every feature/release PR already runs the full
# matrix as the merge gate, and rebase-merge means no semantic-merge surprises,
# so re-running on the push to main only doubled GHA spend.
on:
  pull_request:
jobs:
  test:
    # Skip on automated release version-bump PRs (release/*): they only change
    # the __version__ string against code that already passed CI on its feature
    # PRs, so re-running the full matrix there just burns GHA minutes.
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=tradedesk_marketdata \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=75
