[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tradedesk-marketdata"
dynamic = ["version"]
description = "Market data downloader and candle/tick exporter for backtesting workflows (Dukascopy and HistData.com)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
authors = [
  { name = "Radius Red Ltd.", email = "opensource@radiusred.uk" }
]
maintainers = [
  { name = "Radius Red Ltd.", email = "opensource@radiusred.uk" }
]
keywords = ["market-data", "dukascopy", "histdata", "ticks", "candles", "backtesting", "trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "rich>=14.2",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.5",
    "mypy>=1.19.1",
    "ruff>=0.15.2",
    "types-requests>=2.32.0",
    "pandas-stubs>=2.2.0",
    "pytest>=9.0",
    "pytest-cov>=7.0",
]
parquet = ["pyarrow>=16.1"]
tooling = ["llm-tldr[dev]>=1.5.2"]

[project.scripts]
tradedesk-md-export = "tradedesk_marketdata.cli:main"
tradedesk-md-normalize = "tradedesk_marketdata.normalize_cli:main"
tradedesk-md-rescale = "tradedesk_marketdata.rescale_cli:main"
tradedesk-md-verify = "tradedesk_marketdata.verify_cli:main"
# The pre-2.0 command names, kept as aliases for one major version.
tradedesk-dc-export = "tradedesk_marketdata.cli:main"
tradedesk-dc-normalize = "tradedesk_marketdata.normalize_cli:main"
tradedesk-dc-rescale = "tradedesk_marketdata.rescale_cli:main"

[project.urls]
Homepage = "https://github.com/radiusred"
Repository = "https://github.com/radiusred/tradedesk-marketdata"
Issues = "https://github.com/radiusred/tradedesk-marketdata/issues"

[tool.hatch.build.targets.wheel]
packages = ["tradedesk_marketdata"]

[tool.hatch.version]
path = "tradedesk_marketdata/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tradedesk_marketdata"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]

[[tool.mypy.overrides]]
module = ["requests", "requests.*"]
ignore_missing_imports = true
