# HistData.com symbol map for `tradedesk-md-export --source histdata`.
#
# This file ships with the package and is used when --symbol-map is not given.
# To change it, copy it, edit the copy and pass `--symbol-map your-copy.toml`.
# A symbol that has no entry here is refused before any request is made.
#
# One table per cache symbol (the name the day files are written under):
#
#   [symbols.<CACHE SYMBOL>]
#   name           = HistData's instrument code (required)
#   scale          = cache raw price = HistData decimal price x scale (required, > 0)
#   first_month    = earliest month HistData serves ticks for, "YYYY-MM" (required)
#   scale_verified = true once the scale has been confirmed against another
#                    source's raw values for the same instrument (default false;
#                    an export of an unverified symbol logs a warning)
#   scale_evidence = what confirmed it: required when scale_verified is true
#   exclude        = spans whose HistData data must not be committed (optional):
#                    [{ from = YYYY-MM-DD, to = YYYY-MM-DD, reason = "..." }, ...]
#                    A day inside a span gets no day files and an "excluded"
#                    record in _sources.jsonl with the reason, so another source
#                    can fill it; it is not fetched again until the span goes.
#
# Scales. The cache stores the raw units of the Dukascopy datafeed, so HistData's
# decimal prices are multiplied on decode:
#   10000  FX quoted to a 0.0001 pip:      1.10366   -> 11036.6
#   100    JPY-quoted FX and gold:         179.601   -> 17960.1, 2063.625 -> 206362.5
#   1      indices, in points, as quoted:  4774.361  -> 4774.361
#
# Names and first months were checked against histdata.com's tick-data
# instrument list on 2026-10-08. An entry is verified only where the Dukascopy
# figure that confirmed its scale is recorded in scale_evidence. The others
# follow the convention above and were checked when the map was first written,
# but their figures were not recorded, so they are unverified. To verify one,
# compare a decoded HistData day with a Dukascopy-built day of the same
# instrument and date, and record both values.
# Not on HistData, so not mapped: EURSGD, GBPEUR, BTCUSD.


# Settings for every instrument.
[histdata]
# The month-join level check refuses a month whose first trading day's close is
# more than (1 + max_month_join_step) times, or less than 1 / (1 + it) times,
# the last accepted close before it (the previous month's, or the nearest day
# already in the cache, at most seven days back; after a longer gap there is no
# check), names it, and leaves its days uncommitted. It catches a
# series that switches to another instrument at a month join; an overnight move
# of 70% is not an overnight move. Days in an exclusion span are left out.
max_month_join_step = 0.7

# --- Indices and commodities: HistData uses its own codes -------------------

[symbols.USA500IDXUSD]
name = "SPXUSD"
scale = 1
first_month = "2010-11"
scale_verified = true
scale_evidence = "Dukascopy median close ~4782"

# From 2020-06-17 to 2023-12-05 HistData's GRXEUR runs at about 0.26x the DAX,
# its session ends an hour earlier, and its levels track the Euro Stoxx 50
# (3331 on 2020-09-15, 4152 on 2021-06-15, 4318 on 2023-11-16); outside the
# span it matches a Dukascopy DEUIDXEUR cache day by day.
[symbols.DEUIDXEUR]
name = "GRXEUR"
scale = 1
first_month = "2010-11"
scale_verified = false
exclude = [
  { from = 2020-06-17, to = 2023-12-05, reason = "GRXEUR carries Euro Stoxx 50 levels, not the DAX" },
]

[symbols.GBRIDXGBP]
name = "UKXGBP"
scale = 1
first_month = "2010-11"
scale_verified = false

[symbols.JPNIDXJPY]
name = "JPXJPY"
scale = 1
first_month = "2010-11"
scale_verified = false

[symbols.AUSIDXAUD]
name = "AUXAUD"
scale = 1
first_month = "2010-11"
scale_verified = false

# Dukascopy's raw unit for Brent is cents: 9712.8 for HistData's 97.128.
[symbols.BRENTCMDUSD]
